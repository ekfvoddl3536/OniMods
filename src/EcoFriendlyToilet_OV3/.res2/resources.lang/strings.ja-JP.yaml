0.AUTOPURIFYWASHSINK.NAME: "$(FormatAsLink '環境に優しい洗面台' $id:AutoPurifyWashsink)"
0.AUTOPURIFYWASHSINK.DESC: "複製人間から細菌を除去し、生成された汚染水を浄水して再利用します。"
0.AUTOPURIFYWASHSINK.EFFECT: |-
  細菌に覆われた複製人間は、選択された方向に通り過ぎるときに洗面台を使用します。
  砂があれば、汚染された水をきれいな水に浄水します。浄水された水は再利用されます。
  電力を供給すると、より速く浄水でき、より効率的に使用できます。
