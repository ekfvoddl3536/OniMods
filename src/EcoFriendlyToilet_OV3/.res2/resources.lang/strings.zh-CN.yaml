0.AUTOPURIFYWASHSINK.NAME: "$(FormatAsLink '环保洗手盆' $id:AutoPurifyWashsink)"
0.AUTOPURIFYWASHSINK.DESC: "去除复制人身上的细菌，净化产生的污染水并重复利用。"
0.AUTOPURIFYWASHSINK.EFFECT: |-
  沾染细菌的复制人经过选定方向时会使用洗手盆。
  如果有沙子，它会将污染水净化成干净的水。净化后的水会重复利用。
  供电可以更快地净化，使用效率更高。
