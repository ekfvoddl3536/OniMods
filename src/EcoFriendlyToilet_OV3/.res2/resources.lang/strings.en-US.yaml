0.ECOFRIENDLYTOILET.NAME: "$(FormatAsLink 'Eco-Friendly Outhouse' $id:EcoFriendlyToilet)"
0.ECOFRIENDLYTOILET.DESC: Educate the duplicants on the importance of eco-friendly excretion.
0.ECOFRIENDLYTOILET.EFFECT: |-
  This facility does not require plumbing and produces fertilizer.
  The produced fertilizer must be emptied periodically.
0.AUTOPURIFYWASHSINK.NAME: "$(FormatAsLink 'Eco-Friendly Wash Basin' $id:AutoPurifyWashsink)"
0.AUTOPURIFYWASHSINK.DESC: "Removes germs from duplicants, purifies the polluted water produced, and reuses it."
0.AUTOPURIFYWASHSINK.EFFECT: |-
  Duplicants covered in germs will use the Wash Basin when passing in the selected direction.
  If Sand is available, it purifies the polluted water into clean water. The purified water is reused.
  Supplying power allows for faster purification and more efficient use.
