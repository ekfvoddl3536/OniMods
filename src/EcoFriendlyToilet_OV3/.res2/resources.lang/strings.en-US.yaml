0.ECOFRIENDLYWILDFARMTILE.DESC: Grows one crop.
0.ECOFRIENDLYWILDFARMTILE.EFFECT: "Can be used as a floor tile and rotated before construction, grows and is harvested in a Wild state."
0.ECOFRIENDLYWILDFLOWERPOT.NAME: "$(FormatAsLink 'Natural Flower Pot' $id:EcoFriendlyWildFlowerPot)"
0.ECOFRIENDLYWILDFLOWERPOT.DESC: Plants one plant when a seed is sown.
0.ECOFRIENDLYWILDFLOWERPOT.EFFECT: "Increases Decor and contributes to Morale, grows in a Wild state."
0.ECOFRIENDLYWILDHANGINGPOT.NAME: "$(FormatAsLink 'Natural Hanging Pot' $id:EcoFriendlyWildHangingPot)"
